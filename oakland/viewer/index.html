<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oakland Berth Replay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scene"></div>

  <header id="topbar">
    <div class="title">
      <h1 id="title">Port of Oakland berth replay</h1>
      <div id="subtitle" class="muted">Load a replay JSON</div>
    </div>
    <div id="grade" class="grade"></div>
    <div class="loaders">
      <select id="fixture" title="Demo fixtures">
        <option value="oict-demo">OICT demo</option>
        <option value="matson-demo">Matson demo</option>
      </select>
      <label class="file">Load JSON<input id="file" type="file" accept=".json,application/json"></label>
    </div>
  </header>

  <div id="banner" class="banner hidden">Bar closed: fog</div>

  <aside id="side">
    <div class="cams">
      <button data-cam="overview">Overview</button>
      <button data-cam="quayside">Quayside</button>
      <button data-cam="overhead">Overhead</button>
    </div>
    <table id="ships">
      <thead>
        <tr><th>Ship</th><th>Status</th><th>Berth</th><th>Dep</th><th>Late</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="legend" class="muted small"></div>
  </aside>

  <footer id="controls">
    <button id="play" title="Play or pause (space)">Play</button>
    <div class="speeds">
      <button data-speed="1">1x</button>
      <button data-speed="4" class="on">4x</button>
      <button data-speed="16">16x</button>
      <button data-speed="64">64x</button>
    </div>
    <input id="scrub" type="range" min="0" max="168" step="0.01" value="0">
    <div id="clock">Mon 00:00, hour 0</div>
  </footer>

  <div id="error" class="error hidden"></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="fixtures/demo-fixtures.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
