<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OakGeo map check</title>
  <!--
    Standalone check page for assets/oakland_geo.js: the Port of Oakland map seen from above, with a dropdown that flies
    to each terminal frame and draws its quay as a red line of sections x 42 m (white ticks every section, a yellow
    marker at section 1, a blue arrow toward the water side). Map data (c) OpenStreetMap contributors, ODbL 1.0.
    A stylised representation, not a survey-grade digital twin.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #1d2a33; overflow: hidden;
      font: 14px -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #eef2f5; }
    #ui { position: absolute; top: 12px; left: 12px; background: rgba(12,18,28,0.85); padding: 10px 12px;
      border-radius: 8px; max-width: 360px; }
    #ui select { font: inherit; margin-left: 6px; }
    #info { margin-top: 8px; font-size: 12px; line-height: 1.45; color: #c9d3da; white-space: pre-line; }
    #credit { position: absolute; bottom: 8px; right: 10px; font-size: 11px; color: #c9d3da;
      background: rgba(12,18,28,0.7); padding: 3px 8px; border-radius: 4px; }
    #err { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: #ffb4b4; }
  </style>
</head>
<body>
  <div id="ui">
    <label>View <select id="pick"><option value="">whole port (top down)</option></select></label>
    <label style="margin-left:10px"><input type="checkbox" id="low"> low detail</label>
    <div id="info"></div>
  </div>
  <div id="credit">Map data (c) OpenStreetMap contributors, ODbL. Stylised, not survey grade.</div>
  <div id="err"></div>
  <script src="../vendor/three.min.js"></script>
  <script src="../vendor/OrbitControls.js"></script>
  <script src="oakland_geo.js"></script>
  <script>
  (function () {
    "use strict";
    if (typeof window.OakGeo === "undefined" || typeof THREE === "undefined") {
      document.getElementById("err").textContent = "oakland_geo.js or three.min.js failed to load";
      return;
    }
    const G = window.OakGeo;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fc3d6);
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 5, 60000);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.HemisphereLight(0xdfeaf2, 0x55503f, 0.75));
    const sun = new THREE.DirectionalLight(0xffffff, 0.7);
    sun.position.set(-3000, 6000, 2000);
    scene.add(sun);

    // the viewer owns the water; this page draws a plain stand-in plane at y = 0
    const water = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000),
      new THREE.MeshStandardMaterial({ color: 0x3f6f86, roughness: 0.7, metalness: 0.05 }));
    water.rotation.x = -Math.PI / 2;
    scene.add(water);

    function makeLabel(text, opts) {
      const o = Object.assign({ height: 70, kind: "" }, opts);
      const bg = { terminal: "rgba(150,20,20,0.85)", water: "rgba(16,60,90,0.8)", park: "rgba(50,90,40,0.85)" }[o.kind] ||
        "rgba(12,18,28,0.82)";
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      const font = "600 44px -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif";
      ctx.font = font;
      c.width = Math.ceil(ctx.measureText(text).width) + 36;
      c.height = 70;
      ctx.font = font;
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#ffffff";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 18, c.height / 2 + 2);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthWrite: false }));
      sp.scale.set(o.height * c.width / c.height, o.height, 1);
      sp.renderOrder = 10;
      return sp;
    }

    let map = null;
    function rebuild() {
      if (map) scene.remove(map);
      map = G.buildMap({ detail: document.getElementById("low").checked ? "low" : "full", makeLabel: makeLabel });
      scene.add(map);
    }
    rebuild();
    document.getElementById("low").addEventListener("change", rebuild);

    // the quay check overlay for one terminal, built only from OakGeo.toWorld
    let overlay = null;
    function drawQuay(name) {
      if (overlay) scene.remove(overlay);
      overlay = new THREE.Group();
      if (!name) return;
      const f = G.terminalFrame(name);
      const L = f.sections * G.SECTION_M;
      const y = 6;
      const red = new THREE.MeshBasicMaterial({ color: 0xe02020 });
      const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const a = G.toWorld(name, 0, 0), b = G.toWorld(name, L, 0);
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const bar = new THREE.Mesh(new THREE.BoxGeometry(len, 3, 8), red);
      bar.position.set((a[0] + b[0]) / 2, y, (a[1] + b[1]) / 2);
      bar.rotation.y = -f.heading_rad;
      overlay.add(bar);
      for (let i = 0; i <= f.sections; i++) {
        const p = G.toWorld(name, i * G.SECTION_M, 0);
        const t = new THREE.Mesh(new THREE.BoxGeometry(2, 4, i % 5 === 0 ? 30 : 16), white);
        t.position.set(p[0], y + 0.5, p[1]);
        t.rotation.y = -f.heading_rad;
        overlay.add(t);
      }
      const s1 = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 40, 16), new THREE.MeshBasicMaterial({ color: 0xffd400 }));
      s1.position.set(a[0], 20, a[1]);
      overlay.add(s1);
      const mid = G.toWorld(name, L / 2, 0), tip = G.toWorld(name, L / 2, 160);
      const dir = new THREE.Vector3(tip[0] - mid[0], 0, tip[1] - mid[1]).normalize();
      overlay.add(new THREE.ArrowHelper(dir, new THREE.Vector3(mid[0], y, mid[1]), 160, 0x2a6cff, 50, 30));
      scene.add(overlay);
      const inv = G.toLocal(name, b[0], b[1]);
      document.getElementById("info").textContent =
        f.label + "\n" + f.sections + " sections x 42 m = " + L + " m\n" +
        "origin [" + f.origin.map(Math.round).join(", ") + "], heading " + f.heading_rad.toFixed(3) + " rad\n" +
        "toLocal(end) = [" + inv.map(function (v) { return v.toFixed(1); }).join(", ") + "]\n" +
        "yellow = section 1, white ticks every section, blue arrow = water side (+z local)";
    }

    // camera moves: top down over the port, or a satellite-like oblique view over one terminal
    let fly = null;
    function flyTo(pos, target) {
      fly = { t: 0, p0: camera.position.clone(), q0: controls.target.clone(), p1: pos, q1: target };
    }
    function viewPort() {
      document.getElementById("info").textContent = "Whole port, north up. Pick a terminal to check its quay frame.";
      flyTo(new THREE.Vector3(300, 9000, 300.5), new THREE.Vector3(300, 0, 300));
    }
    function viewTerminal(name) {
      const f = G.terminalFrame(name);
      const L = f.sections * G.SECTION_M;
      const mid = G.toWorld(name, L / 2, 0), back = G.toWorld(name, L / 2, 0.35 * L + 250);
      flyTo(new THREE.Vector3(back[0], Math.max(700, L * 0.9), back[1]), new THREE.Vector3(mid[0], 0, mid[1]));
    }

    const pick = document.getElementById("pick");
    for (const n of G.TERMINAL_NAMES) {
      const o = document.createElement("option");
      o.value = n;
      o.textContent = G.terminalFrame(n).label;
      pick.appendChild(o);
    }
    pick.addEventListener("change", function () {
      drawQuay(pick.value);
      if (pick.value) viewTerminal(pick.value); else viewPort();
    });

    camera.position.set(300, 9000, 300.5);
    controls.target.set(300, 0, 300);
    viewPort();

    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function frameLoop() {
      requestAnimationFrame(frameLoop);
      const dt = clock.getDelta();
      if (fly) {
        fly.t = Math.min(1, fly.t + dt / 1.6);
        const u = fly.t * fly.t * (3 - 2 * fly.t);
        camera.position.lerpVectors(fly.p0, fly.p1, u);
        controls.target.lerpVectors(fly.q0, fly.q1, u);
        if (fly.t >= 1) fly = null;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    frameLoop();
  })();
  </script>
</body>
</html>
